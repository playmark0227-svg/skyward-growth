<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5BA3D9"/>
      <stop offset="55%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#B8E0F5"/>
    </linearGradient>
    <linearGradient id="field1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8BC34A"/>
      <stop offset="100%" stop-color="#558B2F"/>
    </linearGradient>
    <linearGradient id="field2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#AED581"/>
      <stop offset="100%" stop-color="#7CB342"/>
    </linearGradient>
    <linearGradient id="field3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9CCC65"/>
      <stop offset="100%" stop-color="#689F38"/>
    </linearGradient>
    <linearGradient id="tractorBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/></filter>
  </defs>

  <!-- Sky -->
  <rect width="520" height="400" fill="url(#sky2)"/>

  <!-- Clouds -->
  <g opacity="0.9">
    <ellipse cx="80" cy="60" rx="55" ry="22" fill="#fff" opacity="0.8"/>
    <ellipse cx="105" cy="48" rx="42" ry="28" fill="#fff"/>
    <ellipse cx="60" cy="58" rx="32" ry="18" fill="#fff"/>
    <ellipse cx="130" cy="52" rx="30" ry="18" fill="#fff"/>
  </g>
  <g opacity="0.8">
    <ellipse cx="360" cy="45" rx="65" ry="24" fill="#fff" opacity="0.7"/>
    <ellipse cx="385" cy="33" rx="50" ry="30" fill="#fff"/>
    <ellipse cx="335" cy="43" rx="38" ry="20" fill="#fff"/>
  </g>
  <g opacity="0.6">
    <ellipse cx="480" cy="80" rx="40" ry="16" fill="#fff" opacity="0.8"/>
    <ellipse cx="495" cy="70" rx="30" ry="20" fill="#fff"/>
  </g>

  <!-- Distant hills -->
  <ellipse cx="130" cy="220" rx="200" ry="60" fill="#6aaa40" opacity="0.5"/>
  <ellipse cx="400" cy="210" rx="180" ry="55" fill="#5a9a38" opacity="0.4"/>
  <ellipse cx="520" cy="230" rx="160" ry="50" fill="#4a8a30" opacity="0.3"/>

  <!-- Field bands (perspective strips) -->
  <!-- Far field -->
  <path d="M0,230 Q260,215 520,228 L520,255 Q260,240 0,255 Z" fill="url(#field2)" opacity="0.85"/>
  <!-- Mid field -->
  <path d="M0,255 Q260,242 520,258 L520,295 Q260,278 0,295 Z" fill="url(#field1)" opacity="0.9"/>
  <!-- Near-mid field -->
  <path d="M0,295 Q260,280 520,298 L520,340 Q260,322 0,340 Z" fill="url(#field3)" opacity="0.95"/>
  <!-- Near field -->
  <path d="M0,340 Q260,325 520,342 L520,400 L0,400 Z" fill="#558B2F"/>

  <!-- Crop rows on mid field -->
  <g stroke="#4a7a28" stroke-width="1" opacity="0.5">
    <path d="M0,263 Q260,250 520,265"/>
    <path d="M0,272 Q260,259 520,274"/>
    <path d="M0,281 Q260,268 520,283"/>
  </g>
  <!-- Crop rows on near field -->
  <g stroke="#3d6a20" stroke-width="1.2" opacity="0.5">
    <path d="M0,305 Q260,290 520,307"/>
    <path d="M0,318 Q260,303 520,320"/>
    <path d="M0,331 Q260,316 520,333"/>
  </g>

  <!-- Tractor (red, side view) -->
  <g transform="translate(280, 268)" filter="url(#shadow)">
    <!-- Large rear wheel -->
    <circle cx="10" cy="28" r="28" fill="#333" stroke="#555" stroke-width="2"/>
    <circle cx="10" cy="28" r="20" fill="#444"/>
    <circle cx="10" cy="28" r="8" fill="#666"/>
    <!-- Spokes -->
    <g stroke="#555" stroke-width="2">
      <line x1="10" y1="8" x2="10" y2="48"/>
      <line x1="-10" y1="28" x2="30" y2="28"/>
      <line x1="-4" y1="14" x2="24" y2="42"/>
      <line x1="24" y1="14" x2="-4" y2="42"/>
    </g>

    <!-- Small front wheel -->
    <circle cx="75" cy="34" r="16" fill="#333" stroke="#555" stroke-width="1.5"/>
    <circle cx="75" cy="34" r="11" fill="#444"/>
    <circle cx="75" cy="34" r="4" fill="#666"/>

    <!-- Body -->
    <rect x="15" y="-2" width="58" height="32" rx="3" fill="url(#tractorBody)"/>
    <!-- Cab -->
    <rect x="20" y="-28" width="36" height="28" rx="4" fill="#C62828"/>
    <!-- Window -->
    <rect x="24" y="-24" width="12" height="18" rx="2" fill="#B3E5FC" opacity="0.85"/>
    <rect x="39" y="-24" width="12" height="18" rx="2" fill="#B3E5FC" opacity="0.85"/>
    <!-- Exhaust pipe -->
    <rect x="25" y="-42" width="5" height="16" rx="2" fill="#555"/>
    <!-- Smoke puffs -->
    <circle cx="28" cy="-45" r="5" fill="#aaa" opacity="0.5"/>
    <circle cx="31" cy="-52" r="6" fill="#bbb" opacity="0.35"/>
    <circle cx="26" cy="-58" r="7" fill="#ccc" opacity="0.2"/>

    <!-- Attachment/plow behind -->
    <g transform="translate(-30, 15)">
      <rect x="-20" y="0" width="22" height="8" rx="2" fill="#888"/>
      <line x1="-20" y1="4" x2="-38" y2="10" stroke="#777" stroke-width="3"/>
      <line x1="-20" y1="4" x2="-38" y2="16" stroke="#777" stroke-width="3"/>
      <line x1="-20" y1="4" x2="-38" y2="22" stroke="#777" stroke-width="3"/>
    </g>

    <!-- Headlight -->
    <ellipse cx="73" cy="6" rx="4" ry="3" fill="#FFF9C4" opacity="0.9"/>
  </g>

  <!-- Distant farm building -->
  <g transform="translate(60, 198)" opacity="0.7">
    <rect x="0" y="0" width="45" height="28" fill="#ECEFF1"/>
    <polygon points="-3,-3 48,-3 22,-22" fill="#B0BEC5"/>
    <rect x="15" y="10" width="10" height="18" fill="#8D6E63"/>
    <!-- Window -->
    <rect x="3" y="6" width="8" height="8" fill="#B3E5FC" opacity="0.8"/>
    <rect x="33" y="6" width="8" height="8" fill="#B3E5FC" opacity="0.8"/>
  </g>

  <!-- Power line poles -->
  <g stroke="#555" stroke-width="1.5" opacity="0.5">
    <line x1="420" y1="160" x2="420" y2="240"/>
    <line x1="408" y1="170" x2="432" y2="170"/>
    <line x1="460" y1="162" x2="460" y2="238"/>
    <line x1="448" y1="172" x2="472" y2="172"/>
    <line x1="500" y1="165" x2="500" y2="236"/>
    <line x1="488" y1="175" x2="512" y2="175"/>
    <!-- Wires -->
    <path d="M408,170 Q434,175 448,172" fill="none" stroke-width="0.8"/>
    <path d="M448,172 Q474,176 488,175" fill="none" stroke-width="0.8"/>
  </g>

  <!-- Overlay gradient for depth -->
  <rect x="0" y="370" width="520" height="30" fill="#3d6a20" opacity="0.5"/>

  <!-- Label -->
  <text x="260" y="390" text-anchor="middle" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="2">AGRICULTURE — KITAMI, HOKKAIDO</text>
</svg>
