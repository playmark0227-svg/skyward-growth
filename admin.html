<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理画面 | Skyward Growth</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif; background:#f0f2f5; color:#1a1a2e; }

  /* Sidebar */
  .sidebar {
    position:fixed; top:0; left:0; bottom:0; width:240px;
    background:linear-gradient(180deg,#1a1a2e 0%,#16213e 100%);
    color:#fff; padding:32px 24px; z-index:100;
    display:flex; flex-direction:column;
  }
  .sidebar-logo { font-size:18px; font-weight:800; letter-spacing:1px; margin-bottom:8px; }
  .sidebar-sub { font-size:11px; color:rgba(255,255,255,0.4); margin-bottom:48px; letter-spacing:1px; }
  .sidebar-nav { display:flex; flex-direction:column; gap:4px; flex:1; }
  .sidebar-nav a {
    display:flex; align-items:center; gap:12px; padding:12px 16px;
    border-radius:10px; color:rgba(255,255,255,0.6); text-decoration:none;
    font-size:14px; font-weight:500; transition:all 0.2s;
  }
  .sidebar-nav a:hover, .sidebar-nav a.active {
    background:rgba(255,255,255,0.1); color:#fff;
  }
  .sidebar-nav a .icon { font-size:18px; width:24px; text-align:center; }
  .sidebar-user {
    display:flex; align-items:center; gap:12px; padding:16px 0 0;
    border-top:1px solid rgba(255,255,255,0.1); margin-top:auto;
  }
  .sidebar-avatar {
    width:36px; height:36px; border-radius:50%; background:#3cb84a;
    display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700;
  }
  .sidebar-user-info { font-size:12px; }
  .sidebar-user-name { font-weight:600; color:#fff; }
  .sidebar-user-role { color:rgba(255,255,255,0.4); font-size:11px; }

  /* Main content */
  .main { margin-left:240px; padding:32px 40px; min-height:100vh; }

  /* Header */
  .page-header {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:32px;
  }
  .page-title { font-size:24px; font-weight:800; }
  .page-title span { color:#999; font-weight:400; font-size:16px; margin-left:12px; }
  .btn-new {
    display:flex; align-items:center; gap:8px;
    padding:12px 28px; background:#3cb84a; color:#fff;
    border:none; border-radius:12px; font-size:14px; font-weight:700;
    cursor:pointer; transition:all 0.2s; box-shadow:0 4px 16px rgba(60,180,74,0.3);
  }
  .btn-new:hover { background:#2e9a3a; transform:translateY(-1px); box-shadow:0 6px 20px rgba(60,180,74,0.4); }

  /* Stats */
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-bottom:32px; }
  .stat-card {
    background:#fff; border-radius:16px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.04);
  }
  .stat-label { font-size:12px; color:#999; font-weight:600; text-transform:uppercase; letter-spacing:1px; }
  .stat-value { font-size:32px; font-weight:800; margin-top:8px; }
  .stat-value.green { color:#3cb84a; }

  /* Works grid */
  .works-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:20px; }
  .work-card {
    background:#fff; border-radius:16px; overflow:hidden;
    box-shadow:0 2px 12px rgba(0,0,0,0.04); transition:all 0.3s;
  }
  .work-card:hover { transform:translateY(-4px); box-shadow:0 12px 40px rgba(0,0,0,0.1); }
  .work-card-img {
    width:100%; height:200px; object-fit:cover; background:#f0f2f5;
    display:flex; align-items:center; justify-content:center; color:#ccc; font-size:48px;
  }
  .work-card-img img { width:100%; height:200px; object-fit:cover; }
  .work-card-body { padding:20px; }
  .work-card-cat {
    display:inline-block; font-size:11px; font-weight:600;
    padding:3px 10px; border-radius:20px; margin-bottom:10px;
    background:#e8f5e9; color:#3cb84a;
  }
  .work-card-title { font-size:16px; font-weight:700; margin-bottom:8px; line-height:1.5; }
  .work-card-desc { font-size:13px; color:#777; line-height:1.7; margin-bottom:16px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .work-card-footer { display:flex; justify-content:space-between; align-items:center; }
  .work-card-date { font-size:12px; color:#aaa; }
  .work-card-actions { display:flex; gap:8px; }
  .btn-edit, .btn-delete {
    padding:6px 14px; border-radius:8px; font-size:12px; font-weight:600;
    border:none; cursor:pointer; transition:all 0.2s;
  }
  .btn-edit { background:#f0f2f5; color:#555; }
  .btn-edit:hover { background:#e0e2e5; }
  .btn-delete { background:#fff0f0; color:#e74c3c; }
  .btn-delete:hover { background:#fde0e0; }

  /* Empty state */
  .empty-state {
    text-align:center; padding:80px 40px;
    background:#fff; border-radius:16px; box-shadow:0 2px 12px rgba(0,0,0,0.04);
  }
  .empty-icon { font-size:64px; margin-bottom:20px; opacity:0.3; }
  .empty-title { font-size:20px; font-weight:700; margin-bottom:8px; }
  .empty-desc { font-size:14px; color:#999; margin-bottom:24px; }

  /* Modal */
  .modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200;
    display:none; align-items:center; justify-content:center;
    backdrop-filter:blur(4px);
  }
  .modal-overlay.show { display:flex; }
  .modal {
    background:#fff; border-radius:20px; width:560px; max-width:92vw;
    max-height:90vh; overflow-y:auto; box-shadow:0 24px 80px rgba(0,0,0,0.2);
  }
  .modal-header {
    display:flex; align-items:center; justify-content:space-between;
    padding:24px 28px; border-bottom:1px solid #f0f0f0;
  }
  .modal-title { font-size:18px; font-weight:700; }
  .modal-close {
    width:32px; height:32px; border-radius:50%; border:none; background:#f0f2f5;
    font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background 0.2s;
  }
  .modal-close:hover { background:#e0e2e5; }
  .modal-body { padding:28px; }

  .form-group { margin-bottom:20px; }
  .form-label { display:block; font-size:13px; font-weight:600; color:#555; margin-bottom:8px; }
  .form-input, .form-textarea, .form-select {
    width:100%; padding:12px 16px; border:1.5px solid #e0e2e5; border-radius:10px;
    font-size:14px; font-family:inherit; transition:border-color 0.2s;
    background:#fafafa;
  }
  .form-input:focus, .form-textarea:focus, .form-select:focus {
    outline:none; border-color:#3cb84a; background:#fff;
  }
  .form-textarea { resize:vertical; min-height:100px; }

  /* Image upload */
  .img-upload-area {
    border:2px dashed #ddd; border-radius:12px; padding:40px 20px;
    text-align:center; cursor:pointer; transition:all 0.2s; position:relative;
    overflow:hidden;
  }
  .img-upload-area:hover { border-color:#3cb84a; background:#f8fff8; }
  .img-upload-area.has-image { padding:0; border-style:solid; border-color:#e0e2e5; }
  .img-upload-area img { width:100%; height:200px; object-fit:cover; display:block; }
  .img-upload-icon { font-size:32px; margin-bottom:8px; opacity:0.3; }
  .img-upload-text { font-size:13px; color:#999; }
  .img-upload-input { display:none; }

  .modal-footer {
    padding:20px 28px; border-top:1px solid #f0f0f0;
    display:flex; gap:12px; justify-content:flex-end;
  }
  .btn-cancel {
    padding:12px 24px; border-radius:10px; border:1.5px solid #ddd;
    background:#fff; color:#555; font-size:14px; font-weight:600; cursor:pointer;
    transition:all 0.2s;
  }
  .btn-cancel:hover { background:#f5f5f5; }
  .btn-publish {
    padding:12px 32px; border-radius:10px; border:none;
    background:#3cb84a; color:#fff; font-size:14px; font-weight:700; cursor:pointer;
    transition:all 0.2s; box-shadow:0 4px 16px rgba(60,180,74,0.3);
  }
  .btn-publish:hover { background:#2e9a3a; }

  /* Toast */
  .toast {
    position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(80px);
    background:#1a1a2e; color:#fff; padding:14px 28px; border-radius:12px;
    font-size:14px; font-weight:600; z-index:300; opacity:0;
    transition:all 0.4s ease; box-shadow:0 8px 32px rgba(0,0,0,0.2);
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* Mobile */
  @media (max-width: 768px) {
    .sidebar { display:none; }
    .main { margin-left:0; padding:20px 16px; }
    .stats { grid-template-columns:1fr; }
    .works-grid { grid-template-columns:1fr; }
    .page-header { flex-direction:column; gap:16px; align-items:flex-start; }
    .mobile-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:16px 20px; background:#1a1a2e; color:#fff;
    }
    .mobile-header-logo { font-size:16px; font-weight:700; }
  }
  @media (min-width: 769px) {
    .mobile-header { display:none; }
  }
</style>
</head>
<body>

  <!-- Mobile header -->
  <div class="mobile-header">
    <div class="mobile-header-logo">SG 管理画面</div>
    <a href="/" style="color:#fff;font-size:13px;text-decoration:none;opacity:0.6;">サイトを見る →</a>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-logo">Skyward Growth</div>
    <div class="sidebar-sub">MANAGEMENT</div>
    <nav class="sidebar-nav">
      <a href="#" class="active"><span class="icon">📋</span> 実績管理</a>
      <a href="/" target="_blank"><span class="icon">🌐</span> サイトを見る</a>
    </nav>
    <div class="sidebar-user">
      <div class="sidebar-avatar">SG</div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name">管理者</div>
        <div class="sidebar-user-role">Admin</div>
      </div>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="page-header">
      <div class="page-title">実績管理 <span id="works-count-label"></span></div>
      <button class="btn-new" onclick="openModal()">＋ 新規追加</button>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">実績数</div>
        <div class="stat-value green" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">今月追加</div>
        <div class="stat-value" id="stat-month">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">カテゴリ数</div>
        <div class="stat-value" id="stat-cats">0</div>
      </div>
    </div>

    <!-- Works list -->
    <div id="works-list"></div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modal-title">実績を追加</div>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-id">

        <div class="form-group">
          <label class="form-label">カテゴリ</label>
          <select class="form-select" id="form-category">
            <option value="デジタルマーケティング">デジタルマーケティング</option>
            <option value="映像制作">映像制作</option>
            <option value="モビリティ">モビリティ</option>
            <option value="その他">その他</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">タイトル</label>
          <input class="form-input" id="form-title" placeholder="例: 〇〇店のSNS運用代行">
        </div>

        <div class="form-group">
          <label class="form-label">説明</label>
          <textarea class="form-textarea" id="form-desc" placeholder="実績の詳細を入力..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">画像</label>
          <div class="img-upload-area" id="img-area" onclick="document.getElementById('img-input').click()">
            <div id="img-placeholder">
              <div class="img-upload-icon">📷</div>
              <div class="img-upload-text">クリックして画像をアップロード</div>
            </div>
            <input type="file" class="img-upload-input" id="img-input" accept="image/*" onchange="handleImage(this)">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">日付</label>
          <input class="form-input" type="date" id="form-date">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
        <button class="btn-publish" onclick="saveWork()">公開する</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = 'skyward_works';

  function getWorks() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }

  function saveWorks(works) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(works));
  }

  function renderWorks() {
    const works = getWorks();
    const container = document.getElementById('works-list');

    // Stats
    document.getElementById('stat-total').textContent = works.length;
    const now = new Date();
    const thisMonth = works.filter(w => {
      const d = new Date(w.date);
      return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    }).length;
    document.getElementById('stat-month').textContent = thisMonth;
    const cats = [...new Set(works.map(w => w.category))];
    document.getElementById('stat-cats').textContent = cats.length;
    document.getElementById('works-count-label').textContent = works.length > 0 ? `(${works.length}件)` : '';

    if (works.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📂</div>
          <div class="empty-title">まだ実績がありません</div>
          <div class="empty-desc">「新規追加」ボタンから最初の実績を追加しましょう</div>
          <button class="btn-new" onclick="openModal()">＋ 新規追加</button>
        </div>`;
      return;
    }

    // Sort by date descending
    works.sort((a, b) => new Date(b.date) - new Date(a.date));

    container.innerHTML = '<div class="works-grid">' + works.map(w => `
      <div class="work-card">
        <div class="work-card-img">
          ${w.image ? `<img src="${w.image}" alt="${w.title}">` : '📷'}
        </div>
        <div class="work-card-body">
          <span class="work-card-cat">${w.category}</span>
          <div class="work-card-title">${w.title}</div>
          <div class="work-card-desc">${w.description}</div>
          <div class="work-card-footer">
            <span class="work-card-date">${formatDate(w.date)}</span>
            <div class="work-card-actions">
              <button class="btn-edit" onclick="editWork('${w.id}')">編集</button>
              <button class="btn-delete" onclick="deleteWork('${w.id}')">削除</button>
            </div>
          </div>
        </div>
      </div>
    `).join('') + '</div>';
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr);
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  }

  function openModal(work) {
    document.getElementById('modal').classList.add('show');
    if (work) {
      document.getElementById('modal-title').textContent = '実績を編集';
      document.getElementById('edit-id').value = work.id;
      document.getElementById('form-category').value = work.category;
      document.getElementById('form-title').value = work.title;
      document.getElementById('form-desc').value = work.description;
      document.getElementById('form-date').value = work.date;
      if (work.image) {
        const area = document.getElementById('img-area');
        area.classList.add('has-image');
        document.getElementById('img-placeholder').innerHTML = `<img src="${work.image}" alt="">`;
        area.dataset.image = work.image;
      }
    } else {
      document.getElementById('modal-title').textContent = '実績を追加';
      document.getElementById('edit-id').value = '';
      document.getElementById('form-category').value = 'デジタルマーケティング';
      document.getElementById('form-title').value = '';
      document.getElementById('form-desc').value = '';
      document.getElementById('form-date').value = new Date().toISOString().split('T')[0];
      const area = document.getElementById('img-area');
      area.classList.remove('has-image');
      area.dataset.image = '';
      document.getElementById('img-placeholder').innerHTML = `
        <div class="img-upload-icon">📷</div>
        <div class="img-upload-text">クリックして画像をアップロード</div>`;
    }
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('show');
  }

  function handleImage(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      // Compress image
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxW = 800, maxH = 600;
        let w = img.width, h = img.height;
        if (w > maxW) { h = h * maxW / w; w = maxW; }
        if (h > maxH) { w = w * maxH / h; h = maxH; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
        const area = document.getElementById('img-area');
        area.classList.add('has-image');
        area.dataset.image = dataUrl;
        document.getElementById('img-placeholder').innerHTML = `<img src="${dataUrl}" alt="">`;
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function saveWork() {
    const title = document.getElementById('form-title').value.trim();
    const desc = document.getElementById('form-desc').value.trim();
    const category = document.getElementById('form-category').value;
    const date = document.getElementById('form-date').value;
    const image = document.getElementById('img-area').dataset.image || '';
    const editId = document.getElementById('edit-id').value;

    if (!title) { showToast('⚠️ タイトルを入力してください'); return; }
    if (!desc) { showToast('⚠️ 説明を入力してください'); return; }

    const works = getWorks();

    if (editId) {
      const idx = works.findIndex(w => w.id === editId);
      if (idx !== -1) {
        works[idx] = { ...works[idx], title, description: desc, category, date, image };
      }
      showToast('✅ 実績を更新しました');
    } else {
      works.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        title, description: desc, category, date, image,
        createdAt: new Date().toISOString()
      });
      showToast('🎉 実績を公開しました！');
    }

    saveWorks(works);
    closeModal();
    renderWorks();
  }

  function editWork(id) {
    const works = getWorks();
    const work = works.find(w => w.id === id);
    if (work) openModal(work);
  }

  function deleteWork(id) {
    if (!confirm('この実績を削除しますか？')) return;
    const works = getWorks().filter(w => w.id !== id);
    saveWorks(works);
    renderWorks();
    showToast('🗑️ 実績を削除しました');
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  // Init
  renderWorks();

  // Close modal on overlay click
  document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modal')) closeModal();
  });

  // Keyboard shortcut
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });
</script>
</body>
</html>
